<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="index.html" style="display:flex;align-items:center;text-decoration:none" aria-label="Home">
  <img src="{{ src }}" alt="HK logo" style="height:{{ h }};width:auto;display:block">
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:60},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;uploads/HK_logo_gold.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;,&quot;min&quot;:16,&quot;max&quot;:64}}">
class Component extends DCLogic {
  renderVals() {
    return {
      src: this.props.src ?? "uploads/HK_logo_gold.png",
      h: (this.props.height ?? 30) + "px",
    };
  }
}
</script>
</body>
</html>
